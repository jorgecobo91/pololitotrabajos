<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>POLOLITOTRABAJOS — Landing pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif; background: #F4F2EE; color: #1A1816; }
  button { font-family: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="tokens.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="landings.jsx"></script>
<script type="text/babel" src="landings-v2.jsx"></script>
<script type="text/babel" src="landings-v3.jsx"></script>
<script type="text/babel" src="landings-v3b.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="POLOLITOTRABAJOS — Landing">
        <DCSection id="landings" title="Landing — 3 variantes" subtitle="Mobile-first 380px · Plus Jakarta Sans · gradientes del sistema">
          <DCArtboard id="fuego" label="01 · Fuego — naranja editorial" width={380} height={1480}>
            <window.LandingFuego/>
          </DCArtboard>
          <DCArtboard id="pololo" label="02 · Pololo — violeta moderno" width={380} height={1520}>
            <window.LandingPololo/>
          </DCArtboard>
          <DCArtboard id="atardecer" label="03 · Atardecer — duo gradient (premium)" width={380} height={1500}>
            <window.LandingAtardecer/>
          </DCArtboard>
        </DCSection>
        <DCSection id="v2" title="Landing v2 — paletas inspiradas en oficios" subtitle="Cobre & Mezclilla · Casco & Hormigón · Terracota & Verde">
          <DCArtboard id="cobre" label="04 · Cobre & Mezclilla — editorial tierra" width={380} height={1620}>
            <window.LandingCobre/>
          </DCArtboard>
          <DCArtboard id="hormigon" label="05 · Casco & Hormigón — industrial brutalista" width={380} height={1560}>
            <window.LandingHormigon/>
          </DCArtboard>
          <DCArtboard id="terracota" label="06 · Domingo en la Casa — cálido hogar" width={380} height={1620}>
            <window.LandingTerracota/>
          </DCArtboard>
        </DCSection>
        <DCSection id="v3" title="Landing v3 — sistema controlado" subtitle="70% neutros · 20% violeta · 10% naranja · gradiente solo en CTAs clave">
          <DCArtboard id="equilibrio" label="07 · Equilibrio — gradiente controlado naranja→violeta" width={380} height={1660}>
            <window.LandingEquilibrio/>
          </DCArtboard>
          <DCArtboard id="equilibrio-atardecer" label="08 · Equilibrio Atardecer — copy de Atardecer + sistema Equilibrio" width={380} height={1640}>
            <window.LandingEquilibrioAtardecer/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
